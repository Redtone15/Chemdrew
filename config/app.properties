# MolView Studio configuration
# All paths are resolved relative to the workspace/application directory.

window.width=1440
window.height=900
window.minWidth=1080
window.minHeight=700

# The honeycomb lattice is always enabled; bonds are exactly one edge long.
canvas.showGrid=true
canvas.showCarbonLabels=false

# Default export presets shown in the export dialog.
export.image.width=1600
export.image.height=1200
export.pdf.resolution=300
